name: Build release packages
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            command: npm run dist:win
            name: windows-x64
          - os: macos-latest
            command: npm run dist:mac:arm64
            name: macos-arm64
          - os: macos-latest
            command: npm run dist:mac:x64
            name: macos-x64
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm test
      - run: ${{ matrix.command }}
      - name: Verify Mac signatures and disk images
        if: runner.os == 'macOS'
        run: |
          find release -maxdepth 2 -name '*.app' -print0 | while IFS= read -r -d '' bundle; do
            codesign --verify --deep --strict --verbose=2 "$bundle"
            codesign --verify --strict --verbose=2 "$bundle/Contents/Resources/ffmpeg/ffmpeg"
          done
          for image in release/*.dmg; do
            hdiutil verify "$image"
          done
      - run: npm run release:checksums
      - uses: actions/upload-artifact@v4
        with:
          name: Mini-ASS-Editor-${{ matrix.name }}
          if-no-files-found: error
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/SHA256SUMS.txt
